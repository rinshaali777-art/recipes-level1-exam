<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            background: #fffaf2;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .recipe-header {
            min-height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, rgba(255, 145, 0, 0.95), rgba(255, 193, 7, 0.85)),
                url("https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .recipe-header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.18);
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .header-content h1 {
            font-size: 4rem;
            letter-spacing: 4px;
            text-shadow: 2px 3px 8px rgba(0,0,0,0.25);
        }

        .header-content p {
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        /* Section */
        .recipe-section {
            padding: 70px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-weight: 700;
            color: #333;
        }

        .section-title p {
            color: #777;
        }

        /* Cards */
        .recipe-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transition: all 0.35s ease;
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.15);
        }

        .recipe-image {
            height: 230px;
            width: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .recipe-card:hover .recipe-image {
            transform: scale(1.06);
        }

        .image-container {
            overflow: hidden;
            position: relative;
        }

        .recipe-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.95);
            color: #f39c12;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .recipe-name {
            font-size: 19px;
            font-weight: 700;
            color: #333;
            min-height: 48px;
        }

        .rating {
            color: #f5a623;
            font-size: 15px;
            margin-top: 8px;
        }

        .rating i {
            margin-right: 3px;
        }

        .recipe-footer {
            background: transparent;
            border: none;
            padding: 0 24px 25px;
        }

        .view-btn {
            width: 100%;
            border-radius: 30px;
            padding: 10px 20px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ff9800, #ffb300);
            border: none;
            transition: all 0.3s ease;
        }

        .view-btn:hover {
            background: linear-gradient(135deg, #f57c00, #ff9800);
            color: white;
            transform: scale(1.03);
        }

        /* Responsive */
        @media (max-width: 768px) {

            .recipe-header {
                min-height: 280px;
            }

            .header-content h1 {
                font-size: 2.8rem;
            }

            .header-content p {
                font-size: 1rem;
            }

            .recipe-section {
                padding: 45px 0;
            }

            .recipe-image {
                height: 210px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="recipe-header">
        <div class="header-content text-center text-white">
            <h1 class="fw-bolder">RECIPES</h1>
            <p class="mb-0">Discover delicious food & better taste</p>
        </div>
    </header>


    <!-- Recipe Section -->
    <section class="recipe-section">

        <div class="container px-4 px-lg-5">

            <!-- Section Heading -->
            <div class="section-title">
                <h2>Explore Our Recipes</h2>
                <p>Find something delicious to cook today</p>
            </div>

            <!-- Recipe Cards -->
            <div
                class="row gx-4 gy-5 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 justify-content-center"
                id="output">
            </div>

        </div>

    </section>


    <script>

        let output = document.getElementById('output');

        fetch("https://dummyjson.com/recipes")
            .then(data => data.json())
            .then(pro => {

                let products = pro.recipes;

                console.log(products);

                products.forEach(recipe => {

                    output.innerHTML += `

                        <div class="col">

                            <div class="card recipe-card h-100">

                                <div class="image-container">

                                    <img
                                        class="recipe-image"
                                        src="${recipe.image}"
                                        alt="${recipe.name}"
                                    />

                                    <span class="recipe-badge">
                                        <i class="fa-solid fa-star"></i>
                                        ${recipe.rating}
                                    </span>

                                </div>


                                <div class="card-body p-4">

                                    <div class="text-center">

                                        <h5 class="recipe-name">
                                            ${recipe.name}
                                        </h5>

                                        <div class="rating">
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star"></i>
                                            <i class="fa-solid fa-star-half-stroke"></i>

                                            <span class="text-muted ms-1">
                                                ${recipe.rating}
                                            </span>
                                        </div>

                                    </div>

                                </div>


                                <div class="recipe-footer">

                                    <a
                                        class="btn view-btn"
                                        href="page.html?id=${recipe.id}"
                                    >
                                        View Recipe
                                        <i class="fa-solid fa-arrow-right ms-2"></i>
                                    </a>

                                </div>

                            </div>

                        </div>

                    `;

                });

            })
            .catch(error => {

                console.log("Error:", error);

            });

    </script>

</body>
</html>
